<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <button class="rock">Rock</button>
    <button class="paper">Paper</button>
    <button class="scissors">Scissors</button>

    <div class="score"></div>
    <div class="results"></div>
    
    <script>
        
        function getComputerChoice() {
            let computerChoice = Math.random();
            if (computerChoice <= 0.33) {
                computerChoice = "rock";
            }
            else if (computerChoice > 0.33 && computerChoice <= 0.66) {
                computerChoice = "paper";
            }
            else {
                computerChoice = "scissors";
            }
            return computerChoice;
        }

        function playRound(computerChoice, humanChoice) {
            if ((computerChoice === "rock" && humanChoice === "paper") || (computerChoice === "paper" && humanChoice === "scissors")
             || (computerChoice === "scissors" && humanChoice === "rock")) {
                results.textContent = "You win! " + humanChoice + " beats " + computerChoice;
                humanScore++;
            }
            else if ((computerChoice === "paper" && humanChoice === "rock") || (computerChoice === "rock" && humanChoice === "scissors")
             || (computerChoice === "scissors" && humanChoice === "paper")) {
                results.textContent = "Computer wins :') " + computerChoice + " beats " + humanChoice;
                computerScore++;
            }
            else {
                console.log("it's a draw :')" + computerChoice + " " + humanChoice);
            }
            roundsPlayed++;
            if (roundsPlayed == 5) {
                determineWinner();
            }
        }

        function determineWinner() {
            if (humanScore > computerScore) {
                const scoreDisplay = document.querySelector("score");
                scoreDisplay.textContent = "You : " + humanScore + " Computer : " + computerScore;
            }
            else if (humanScore < computerScore) {
                console.log("Sorry, you lost :')");
            }
            else {
                console.log("It's a draw");
            }
            console.log("Your Score: " + humanScore + " Computer's Score: " + computerScore);
        }


        const rock = document.querySelector("rock");
        rock.addEventListener("click", function() {
            playRound(getComputerChoice(), "rock");
        });

        const paper = document.querySelector("paper");
        paper.addEventListener("click", function() {
            playRound(getComputerChoice(), "paper");
        });    

        const scissors = document.querySelector("scissors");
        scissors.addEventListener("click", function() {
            playRound(getComputerChoice(), "scissors");
        });


        let humanScore = 0;
        let computerScore = 0;
        let roundsPlayed = 0;

        
    </script>
</body>
</html>
