<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <button id="rock">Rock</button>
    <button id="paper">Paper</button>
    <button id="scissors">Scissors</button>

    <div id="score"></div>
    <div id="results"></div>
    
    <script>
        
        function getComputerChoice() {  // DONE
            let computerChoice = Math.random();
            if (computerChoice <= 0.33) {
                computerChoice = "rock";
            }
            else if (computerChoice > 0.33 && computerChoice <= 0.66) {
                computerChoice = "paper";
            }
            else {
                computerChoice = "scissors";
            }
            return computerChoice;
        }

        function playRound(computerChoice, humanChoice) {
            if ((computerChoice === "rock" && humanChoice === "paper") || 
                (computerChoice === "paper" && humanChoice === "scissors") ||
                (computerChoice === "scissors" && humanChoice === "rock")) {

                resultsDisplay.textContent = "You win! " + humanChoice + " beats " 
                + computerChoice;
                humanScore++;
            }

            else if ((computerChoice === "paper" && humanChoice === "rock") ||
                     (computerChoice === "rock" && humanChoice === "scissors") ||
                     (computerChoice === "scissors" && humanChoice === "paper")) {

                resultsDisplay.textContent = "Computer wins :') " + computerChoice + " beats " 
                + humanChoice;
                computerScore++;
            }

            else {

                resultsDisplay.textContent = "it's a draw :')" + computerChoice + " " 
                + humanChoice;
            }

            roundsPlayed++;
            if (roundsPlayed === 5) {
                determineWinner();
            }
        }

        function determineWinner() {

            const scoreDisplay = document.querySelector("#score");
            const resultsDisplay = document.querySelector("#results");
            const button = document.querySelector("button");

            if (humanScore > computerScore) {
                
                resultsDisplay.textContent = "Congratulations! You win!";
                scoreDisplay.textContent = "You : " + humanScore + " Computer : " 
                + computerScore;
                button.addEventListener("click", (event) => {
                event.preventDefault();
            })
            }

            else if (humanScore < computerScore) {

                resultsDisplay.textContent = "Sorry, you lost :')";
                scoreDisplay.textContent = "Your Score: " + humanScore + " Computer's Score: " 
                + computerScore;
                button.addEventListener("click", (event) => {
                event.preventDefault();
            })
            }

            else if (humanScore != "rock" || humanScore != "paper" || humanScore != "scissors") {

                scoreDisplay.textContent = "Your Score: " + humanScore + " Computer's Score: " 
                + computerScore;
                button.addEventListener("click", (event) => {
                event.preventDefault();
            })
                
            }

            else if (humanScore === computerScore) {

                scoreDisplay.textContent = "It's a draw";
                resultsDisplay.textContent = "Your Score: " + humanScore + " Computer's Score: " 
                + computerScore;
                button.addEventListener("click", (event) => {
                event.preventDefault();
            })
            };


            
        }

        const rockButton = document.querySelector("#rock");
        rockButton.addEventListener("click", function() {
            playRound(getComputerChoice(), "rock");
            event.preventDefault();

        });

        const paperButton = document.querySelector("#paper");
        paperButton.addEventListener("click", function() {
            playRound(getComputerChoice(), "paper");
            event.preventDefault();
        });    

        const scissorsButton = document.querySelector("#scissors");
        scissorsButton.addEventListener("click", function() {
            playRound(getComputerChoice(), "scissors");
            event.preventDefault();
        });

        const scoreDisplay = document.querySelector("#score");
        const resultsDisplay = document.querySelector("#results");


        let humanScore = 0;
        let computerScore = 0;
        let roundsPlayed = 0;

        determineWinner();

        
    </script>
</body>
</html>
